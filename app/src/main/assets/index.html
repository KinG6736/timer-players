<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#071321"><title>Таймеры игроков</title>
<style>
:root{color-scheme:dark;--bg:#071321;--panel:#0b1a2b;--line:#183652;--muted:#8fb3df;--green:#00d98b;--blue:#1688ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#06111f,#08182a);color:#eff6ff;font-family:system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:14px;padding-bottom:82px}.top{padding:18px 14px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}.logo{font-size:28px;background:#102e50;border-radius:50%;padding:8px}.head{flex:1;min-width:0}.head h1{font-size:20px;margin:0;font-weight:800}.sub{color:var(--muted);font-size:13px;margin-top:3px}.gear,.iconbtn{background:#10243b;border:1px solid #21466c;color:#c4ddff;border-radius:12px;padding:10px;font-size:19px}.searchrow{display:flex;gap:8px;padding:10px 12px}.searchrow input{flex:1;min-width:0}.controls{display:flex;gap:8px;padding:0 12px 10px}.controls select{width:50%;min-width:0}input,select,textarea{background:#0d2035;color:#eaf4ff;border:1px solid #214466;border-radius:11px;padding:10px;font:inherit;outline:none}button{font:inherit;cursor:pointer}.list{padding:0 10px;display:grid;gap:8px}.player{background:linear-gradient(110deg,#0d1d30,#0a1929);border:1px solid #153653;border-radius:17px;padding:10px;display:grid;grid-template-columns:34px 48px minmax(0,1fr) 42px;gap:8px;align-items:center}.num{font-weight:800;color:#9bc4ff;font-size:15px;align-self:start;padding-top:4px}.avatar{width:46px;height:46px;border-radius:50%;background:#173d60;display:flex;align-items:center;justify-content:center;font-size:24px;border:1px solid #31618b}.main{min-width:0}.nameRow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.name{font-size:15px;font-weight:700;overflow-wrap:anywhere}.count{font-size:11px;color:#00efaa;border:1px solid #008e68;background:#003c34;border-radius:99px;padding:2px 6px;white-space:nowrap}.time{font-size:14px;font-weight:700;letter-spacing:.1px;margin:2px 0 5px;white-space:nowrap}.progressrow{display:flex;align-items:center;gap:7px}.track{height:8px;flex:1;min-width:15px;background:#19314e;border-radius:99px;overflow:hidden}.bar{height:100%;border-radius:99px;transition:width .3s}.pct{width:31px;text-align:right;font-weight:800;font-size:12px}.comment{font-size:11px;color:#8fc5f7;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.comment.empty{opacity:.7}.actions{display:flex;flex-direction:column;align-items:stretch;gap:5px}.buff{border:1px solid #00ef9a;background:linear-gradient(135deg,#00bd7a,#007d58);color:white;border-radius:11px;padding:9px 4px;font-size:11px;font-weight:800;white-space:nowrap}.buff small{display:block;color:#c9ffeb;font-size:9px;font-weight:500;margin-top:3px}.pencil{border:1px solid #234c73;background:#10243b;color:#c3ddff;border-radius:10px;height:35px;font-size:19px}.more{background:transparent;border:0;color:#a7c8f5;font-size:20px;height:25px}.fab{position:fixed;right:14px;bottom:70px;background:#087cff;color:white;border:0;border-radius:99px;padding:12px 18px;box-shadow:0 5px 20px #001a3d;font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#081626;border-top:1px solid #173956;padding:8px 0 10px;color:#8caed5}.nav div{text-align:center;font-size:11px}.nav b{display:block;font-size:19px;margin-bottom:2px}.nav .active{color:#168bff}.empty{text-align:center;color:var(--muted);padding:28px}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.dialog{width:100%;max-width:420px;background:#0b1a2b;border:1px solid #285178;border-radius:18px;padding:18px;display:grid;gap:10px;max-height:90vh;overflow:auto}.dialog h2{margin:0 0 4px}.dialog label{color:#a9c7e9;font-size:12px}.dialog input,.dialog textarea,.dialog select{width:100%}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.save{background:#087cff;border:0;color:white;border-radius:11px;padding:12px;font-weight:700}.cancel{background:#132a43;border:1px solid #25486a;color:#cce1fa;border-radius:11px;padding:11px}.muted{color:#88aaca;font-size:12px}
@media(min-width:600px){.list{max-width:850px;margin:auto}.top,.searchrow,.controls{max-width:850px;margin-left:auto;margin-right:auto}.player{grid-template-columns:40px 52px minmax(0,1fr) 48px}.avatar{width:50px;height:50px}.name{font-size:16px}.time{font-size:15px}.buff{font-size:12px;padding:10px 6px}}
</style></head><body>
<header class="top"><div class="logo">👥</div><div class="head"><h1>Таймеры игроков</h1><div class="sub" id="total">Всего: 0 / 99</div></div><button class="gear" onclick="settings()" aria-label="Настройки">⚙</button></header>
<div class="searchrow"><input id="search" placeholder="⌕  Поиск игрока..." oninput="render()"><button class="iconbtn" onclick="sortPlayers()" title="Сортировать">↕</button></div>
<div class="controls"><select id="limit" onchange="setLimit(this.value)" aria-label="Максимум игроков"><option value="10">Макс. игроков: 10</option><option value="25">Макс. игроков: 25</option><option value="50">Макс. игроков: 50</option><option value="75">Макс. игроков: 75</option><option value="99" selected>Макс. игроков: 99</option></select><select id="sorting" onchange="render()"><option value="default">Порядок: по номеру</option><option value="time">Сначала меньше времени</option><option value="buff">Больше баффов</option><option value="name">По имени</option></select></div>
<main class="list" id="list"></main><button class="fab" onclick="addPlayer()">＋ Добавить</button><nav class="nav"><div class="active"><b>♟</b>Игроки</div><div onclick="showComments()"><b>▤</b>Комментарии</div><div onclick="settings()"><b>⚙</b>Настройки</div></nav>
<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<script>
const KEY='timerPlayers.v1', SETTINGS='timerPlayers.settings';let players=[],cfg={limit:99},editId=null,sortFlip=false;
function load(){try{players=JSON.parse(localStorage.getItem(KEY)||'[]');cfg={...cfg,...JSON.parse(localStorage.getItem(SETTINGS)||'{}')}}catch(e){players=[]}if(!players.length){for(let i=1;i<=10;i++)players.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+i),name:['Монах','Войтель','Саймон','Креон','Луна','Тень','Гром','Роза','Ворон','Снежная'][i-1],end:Date.now()+[142,76,58,21,12,89,173,34,99,5][i-1]*86400000,buffs:[7,3,5,2,4,1,6,2,0,3][i-1],comment:['Фарм до конца недели','Нужно усилить после 50 дней','Проверить на следующей неделе','Может быть полезен для клана','Срочно проверить!','Без комментария','Хороший игрок, не трогать','Проверить активность','Пока всё стабильно','Крайне важно!'][i-1],initial:([142,76,58,21,12,89,173,34,99,5][i-1]*86400000)});save()}document.getElementById('limit').value=String(cfg.limit);render()}
function save(){localStorage.setItem(KEY,JSON.stringify(players));localStorage.setItem(SETTINGS,JSON.stringify(cfg))}function left(p){return Math.max(0,p.end-Date.now())}function fmt(ms){let s=Math.floor(ms/1000),d=Math.floor(s/86400);s%=86400;let h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);s%=60;return `${d} д. ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function render(){let q=(document.getElementById('search')?.value||'').toLowerCase(),mode=document.getElementById('sorting')?.value||'default';let arr=players.filter(p=>(p.name+' '+p.comment).toLowerCase().includes(q));if(mode==='time')arr.sort((a,b)=>left(a)-left(b));if(mode==='buff')arr.sort((a,b)=>b.buffs-a.buffs);if(mode==='name')arr.sort((a,b)=>a.name.localeCompare(b.name,'ru'));if(mode==='default')arr.sort((a,b)=>players.indexOf(a)-players.indexOf(b));document.getElementById('total').textContent=`Всего: ${players.length} / ${cfg.limit}`;document.getElementById('list').innerHTML=arr.length?arr.map((p)=>{let ms=left(p),pct=p.initial>0?Math.max(0,Math.min(100,ms/p.initial*100)):0,color=pct>50?'#00d98b':pct>20?'#f5bd20':'#ff354f',n=players.indexOf(p)+1;return `<article class="player"><div class="num">${String(n).padStart(3,'0')}</div><div class="avatar">${avatar(p.name)}</div><div class="main"><div class="nameRow"><span class="name">${esc(p.name)}</span><span class="count">${p.buffs} бафф${plural(p.buffs)}</span></div><div class="time">${fmt(ms)}</div><div class="progressrow"><div class="track"><div class="bar" style="width:${pct}%;background:${color}"></div></div><span class="pct" style="color:${color}">${Math.round(pct)}%</span></div><div class="comment ${p.comment?'':'empty'}">☏ ${esc(p.comment||'Без комментария')}</div></div><div class="actions"><button class="buff" onclick="buff('${p.id}')">⚡ −15%<small>Нажато ${p.buffs} ${pluralTimes(p.buffs)}</small></button><button class="pencil" onclick="editPlayer('${p.id}')" aria-label="Редактировать">✎</button><button class="more" onclick="playerMenu('${p.id}')" aria-label="Меню">⋮</button></div></article>`}).join(''):'<div class="empty">Игроки не найдены</div>'}
function plural(n){let x=n%10,y=n%100;return x===1&&y!==11?'':'ов'}function pluralTimes(n){return n===1?'раз':'раз'}function avatar(name){let icons={'Монах':'🥷','Войтель':'🧝🏻‍♀️','Саймон':'🧑🏻','Креон':'👹','Луна':'🧝🏻‍♀️','Тень':'🌑','Гром':'🧔🏻','Роза':'🌹','Ворон':'🦅','Снежная':'❄️'};return icons[name]||'👤'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function buff(id){let p=players.find(x=>x.id===id);if(!p)return;let ms=left(p);p.end=Date.now()+ms*.85;p.buffs++;save();render()}function openModal(html){document.getElementById('dialog').innerHTML=html;document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function editPlayer(id){let p=players.find(x=>x.id===id);if(!p)return;editId=id;let ms=left(p),days=Math.max(1,Math.min(200,Math.ceil(ms/86400000))),hrs=Math.floor(ms/3600000)%24,mins=Math.floor(ms/60000)%60;openModal(`<h2>✎ Игрок</h2><label>Имя</label><input id="pname" maxlength="60" value="${esc(p.name)}"><label>Оставшееся время (1–200 дней)</label><input id="pdays" type="number" min="1" max="200" value="${days}"><div class="formrow"><div><label>Часы</label><input id="phours" type="number" min="0" max="23" value="${hrs}"></div><div><label>Минуты</label><input id="pmins" type="number" min="0" max="59" value="${mins}"></div></div><label>Комментарий</label><textarea id="pcomment" rows="3" maxlength="500">${esc(p.comment||'')}</textarea><div class="muted">Нажатий баффа: ${p.buffs}</div><button class="save" onclick="saveEdit()">Сохранить</button><button class="cancel" onclick="closeModal()">Отмена</button>`)}
function saveEdit(){let p=players.find(x=>x.id===editId);if(!p)return;let name=document.getElementById('pname').value.trim()||'Без имени',days=Math.max(1,Math.min(200,parseInt(document.getElementById('pdays').value)||1)),h=Math.max(0,Math.min(23,parseInt(document.getElementById('phours').value)||0)),m=Math.max(0,Math.min(59,parseInt(document.getElementById('pmins').value)||0));p.name=name;p.end=Date.now()+((days*24+h)*60+m)*60000;p.initial=((days*24+h)*60+m)*60000;p.comment=document.getElementById('pcomment').value.trim();save();closeModal();render()}
function addPlayer(){if(players.length>=cfg.limit){openModal(`<h2>Лимит достигнут</h2><p>Добавлено ${players.length} из ${cfg.limit} игроков. Измени максимальное количество в настройках.</p><button class="save" onclick="closeModal();settings()">Настройки</button><button class="cancel" onclick="closeModal()">Закрыть</button>`);return}editId=null;openModal(`<h2>＋ Новый игрок</h2><label>Имя</label><input id="pname" maxlength="60" placeholder="Имя игрока"><label>Таймер (1–200 дней)</label><input id="pdays" type="number" min="1" max="200" value="30"><div class="formrow"><div><label>Часы</label><input id="phours" type="number" min="0" max="23" value="0"></div><div><label>Минуты</label><input id="pmins" type="number" min="0" max="59" value="0"></div></div><label>Комментарий</label><textarea id="pcomment" rows="2" placeholder="Необязательно"></textarea><button class="save" onclick="createPlayer()">Добавить</button><button class="cancel" onclick="closeModal()">Отмена</button>`)}
function createPlayer(){let days=Math.max(1,Math.min(200,parseInt(document.getElementById('pdays').value)||30)),h=Math.max(0,Math.min(23,parseInt(document.getElementById('phours').value)||0)),m=Math.max(0,Math.min(59,parseInt(document.getElementById('pmins').value)||0)),ms=((days*24+h)*60+m)*60000;players.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name:document.getElementById('pname').value.trim()||`Игрок ${players.length+1}`,end:Date.now()+ms,initial:ms,buffs:0,comment:document.getElementById('pcomment').value.trim()});save();closeModal();render()}
function setLimit(v){cfg.limit=Math.max(1,Math.min(99,parseInt(v)||99));save();render()}function settings(){openModal(`<h2>⚙ Настройки</h2><label>Максимальное количество игроков (1–99)</label><input id="setlimit" type="number" min="1" max="99" value="${cfg.limit}"><p class="muted">При уменьшении лимита существующие игроки и их данные не удаляются.</p><button class="save" onclick="cfg.limit=Math.max(1,Math.min(99,parseInt(document.getElementById('setlimit').value)||99));save();document.getElementById('limit').value=String([10,25,50,75,99].includes(cfg.limit)?cfg.limit:99);closeModal();render()">Сохранить</button><button class="cancel" onclick="closeModal()">Отмена</button>`)}function playerMenu(id){let p=players.find(x=>x.id===id);if(!p)return;openModal(`<h2>${esc(p.name)}</h2><p>Баффов использовано: <b>${p.buffs}</b></p><button class="save" onclick="closeModal();editPlayer('${id}')">✎ Редактировать игрока</button><button class="cancel" onclick="if(confirm('Удалить игрока и его комментарий?')){players=players.filter(x=>x.id!=='${id}');save();closeModal();render()}else closeModal()">Удалить игрока</button><button class="cancel" onclick="closeModal()">Закрыть</button>`)}function sortPlayers(){let s=document.getElementById('sorting');s.value=s.value==='time'?'default':'time';render()}function showComments(){openModal(`<h2>Комментарии игроков</h2>${players.filter(p=>p.comment).map(p=>`<p><b>${esc(p.name)}:</b> ${esc(p.comment)}</p>`).join('')||'<p class="muted">Комментариев пока нет.</p>'}<button class="cancel" onclick="closeModal()">Закрыть</button>`)}load();setInterval(()=>{if(document.getElementById('modal').style.display!=='flex')render()},1000);
</script></body></html>
