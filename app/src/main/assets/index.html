<script>
const KEY='timerPlayers.v1', SETTINGS='timerPlayers.settings';let players=[],activeTab='construction',cfg={limit:99},editId=null,sortFlip=false;
function load(){
  try { cfg={...cfg,...JSON.parse(localStorage.getItem(SETTINGS)||'{}')}; }
  catch(e) {}
  players=[];
  document.getElementById('limit').value=String(cfg.limit);
  render();
}
function save(){
  localStorage.setItem(KEY,JSON.stringify(players));
  localStorage.setItem(SETTINGS,JSON.stringify(cfg));
  if(cloudReady) cloudSyncChanges();
}function left(p){return Math.max(0,p.end-Date.now())}function fmt(ms){let s=Math.floor(ms/1000),d=Math.floor(s/86400);s%=86400;let h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);s%=60;return `${d} д. ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function readAvatar(){return new Promise(resolve=>{let input=document.getElementById('pavatar'),file=input?.files?.[0];if(!file){resolve(null);return}let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');c.width=c.height=192;let x=c.getContext('2d'),side=Math.min(img.width,img.height);x.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,192,192);resolve(c.toDataURL('image/jpeg',.78))};img.onerror=()=>resolve(null);img.src=reader.result};reader.onerror=()=>resolve(null);reader.readAsDataURL(file)})}
function switchTab(tab){
    if(!['construction','research','chat'].includes(tab))return;
    activeTab=tab;
    document.getElementById('tab-construction').classList.toggle('active',tab==='construction');
    document.getElementById('tab-research').classList.toggle('active',tab==='research');
    document.getElementById('tab-chat').classList.toggle('active',tab==='chat');
    const chatting=tab==='chat';
    document.getElementById('chatPanel').style.display=chatting?'block':'none';
    document.getElementById('list').style.display=chatting?'none':'';
    document.querySelector('.searchrow').style.display=chatting?'none':'';
    document.querySelector('.fab').style.display=chatting?'none':'';
    if(chatting)initChat();
    else render();
}

let usedBuffPlayerIds = new Set();
let buffUsageLoaded = false;

async function refreshBuffUsage(){
  usedBuffPlayerIds.clear();
  buffUsageLoaded=false;
  if(!supabaseClient||!currentAuthSession){
    render();
    return;
  }
  try{
    const {data,error}=await supabaseClient.rpc('get_player_buff_used_today');
    if(error)throw error;
    usedBuffPlayerIds=new Set((data||[]).map(r=>String(r.player_id)));
    buffUsageLoaded=true;
  }catch(e){
    console.error('Buff usage load:',e);
  }
  render();
}

function render(){players.forEach(p=>{p.buffs=Math.max(0,Number(p.buffs)||0)});let q=(document.getElementById('search')?.value||'').toLowerCase(),mode=window.timeSortMode||'time';let arr=players.filter(p=>(p.category||'construction')===activeTab&&(p.name+' '+p.comment).toLowerCase().includes(q));if(mode==='time')arr.sort((a,b)=>left(a)-left(b));if(mode==='timeDesc')arr.sort((a,b)=>left(b)-left(a));if(mode==='buff')arr.sort((a,b)=>b.buffs-a.buffs);if(mode==='name')arr.sort((a,b)=>a.name.localeCompare(b.name,'ru'));if(mode==='default')arr.sort((a,b)=>players.indexOf(a)-players.indexOf(b));document.getElementById('total').textContent=`Всего: ${players.filter(p=>(p.category||'construction')===activeTab).length} / ${cfg.limit}`;document.getElementById('list').innerHTML=arr.length?arr.map((p)=>{let ms=left(p),pct=p.initial>0?Math.max(0,Math.min(100,ms/p.initial*100)):0,color=pct>50?'#00d98b':pct>20?'#f5bd20':'#ff354f',n=arr.indexOf(p)+1,locked=!buffUsageLoaded||!currentAuthSession||p.linkedUserId===currentAuthSession.user.id||usedBuffPlayerIds.size>0;return `<article class="player"><div class="avatar">${p.avatar?`<img class="avatar-img" src="${p.avatar}" alt="">`:avatar(p.name)}</div><div class="main"><div class="nameRow"><span class="name">${esc(p.name)}</span><span class="count">${p.buffs} бафф${plural(p.buffs)}</span></div><div class="time">${fmt(ms)}</div><div class="progressrow"><div class="track"><div class="bar" style="width:${pct}%;background:${color}"></div></div><span class="pct" style="color:${color}">${Math.round(pct)}%</span></div><div class="comment"><span class="comment-icon">☏</span><span class="comment-text">${esc(p.comment||'Без комментария')}</span></div></div><div class="actions"><button class="buff" ${locked?'disabled':''} onclick="buff('${p.id}',5)">⚡ −5%</button><button class="buff" ${locked?'disabled':''} onclick="buff('${p.id}',10)">⚡ −10%</button><button class="buff" ${locked?'disabled':''} onclick="buff('${p.id}',15)">⚡ −15%</button><button class="pencil" onclick="playerMenu('${p.id}')" aria-label="Меню игрока">✎</button></div></article>`}).join(''):'<div class="empty">Игроки не найдены</div>'}
function plural(n){let x=n%10,y=n%100;return x===1&&y!==11?'':'ов'}function pluralTimes(n){return n===1?'раз':'раз'}function avatar(name){let icons={'Монах':'🥷','Войтель':'🧝🏻‍♀️','Саймон':'🧑🏻','Креон':'👹','Луна':'🧝🏻‍♀️','Тень':'🌑','Гром':'🧔🏻','Роза':'🌹','Ворон':'🦅','Снежная':'❄️'};return icons[name]||'👤'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function buff(id,percent){
  const p=players.find(x=>String(x.id)===String(id));
  percent=Number(percent);
  if(!p||![5,10,15].includes(percent))return;
  if(!currentAuthSession||!supabaseClient){
    alert('Войди в аккаунт, чтобы использовать бафф.');
    return;
  }
try{
    const {error}=await supabaseClient.rpc('apply_player_buff',{
      p_player_id:id,p_percent:percent
    });
    if(error)throw error;
    await cloudLoadPlayers();
    alert('Бафф успешно применён.');
  }catch(e){
    alert(e.message||'Не удалось применить бафф.');
  }
}function openModal(html){document.getElementById('dialog').innerHTML=html;document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function editPlayer(id){let p=players.find(x=>x.id===id);if(!p)return;editId=id;let ms=left(p),days=Math.max(1,Math.min(200,Math.ceil(ms/86400000))),hrs=Math.floor(ms/3600000)%24,mins=Math.floor(ms/60000)%60;openModal(`<h2>✎ Игрок</h2><label>Имя</label><input id="pname" maxlength="60" value="${esc(p.name)}"><label>Фото игрока</label><input id="pavatar" type="file" accept="image/*"><label>Оставшееся время (1–200 дней)</label><input id="pdays" type="number" min="1" max="200" value="${days}"><div class="formrow"><div><label>Часы</label><input id="phours" type="number" min="0" max="23" value="${hrs}"></div><div><label>Минуты</label><input id="pmins" type="number" min="0" max="59" value="${mins}"></div></div><label>Комментарий</label><textarea id="pcomment" rows="3" maxlength="500">${esc(p.comment||'Без комментария')}</textarea><div class="muted">Нажатий баффа: ${p.buffs}</div><button class="save" onclick="saveEdit()">Сохранить</button><button class="cancel" onclick="closeModal()">Отмена</button>`)}
async function saveEdit(){let p=players.find(x=>x.id===editId);if(!p)return;let name=document.getElementById('pname').value.trim()||'Без имени',days=Math.max(1,Math.min(200,parseInt(document.getElementById('pdays').value)||1)),h=Math.max(0,Math.min(23,parseInt(document.getElementById('phours').value)||0)),m=Math.max(0,Math.min(59,parseInt(document.getElementById('pmins').value)||0));p.name=name;p.end=Date.now()+((days*24+h)*60+m)*60000;p.initial=((days*24+h)*60+m)*60000;p.buffs=0;p.comment=document.getElementById('pcomment').value.trim();let photo=await readAvatar();if(photo)p.avatar=photo;save();closeModal();render()}
function addPlayer(){if(players.length>=cfg.limit){openModal(`<h2>Лимит достигнут</h2><p>Добавлено ${players.length} из ${cfg.limit} игроков. Измени максимальное количество в настройках.</p><button class="save" onclick="closeModal();settings()">Настройки</button><button class="cancel" onclick="closeModal()">Закрыть</button>`);return}editId=null;openModal(`<h2>＋ Новый игрок</h2><label>Имя</label><input id="pname" maxlength="60" placeholder="Имя игрока"><label>Фото игрока</label><input id="pavatar" type="file" accept="image/*"><label>Таймер (1–200 дней)</label><input id="pdays" type="number" min="1" max="200" value="30"><div class="formrow"><div><label>Часы</label><input id="phours" type="number" min="0" max="23" value="0"></div><div><label>Минуты</label><input id="pmins" type="number" min="0" max="59" value="0"></div></div><label>Комментарий</label><textarea id="pcomment" rows="2" placeholder="Необязательно"></textarea><button class="save" onclick="createPlayer()">Добавить</button><button class="cancel" onclick="closeModal()">Отмена</button>`)}
async function createPlayer(){let days=Math.max(1,Math.min(200,parseInt(document.getElementById('pdays').value)||30)),h=Math.max(0,Math.min(23,parseInt(document.getElementById('phours').value)||0)),m=Math.max(0,Math.min(59,parseInt(document.getElementById('pmins').value)||0)),ms=((days*24+h)*60+m)*60000;players.push({id:cloudUUID(),name:document.getElementById('pname').value.trim()||`Игрок ${players.length+1}`,category:activeTab,end:Date.now()+ms,initial:ms,buffs:0,comment:document.getElementById('pcomment').value.trim(),avatar:await readAvatar()});save();closeModal();render()}
function setLimit(v){cfg.limit=Math.max(1,Math.min(99,parseInt(v)||99));save();render()}function settings(){openModal(`<h2>⚙ Настройки</h2><label>Максимальное количество игроков (1–99)</label><input id="setlimit" type="number" min="1" max="99" value="${cfg.limit}"><p class="muted">При уменьшении лимита существующие игроки и их данные не удаляются.</p><button class="save" onclick="cfg.limit=Math.max(1,Math.min(99,parseInt(document.getElementById('setlimit').value)||99));save();document.getElementById('limit').value=String([10,25,50,75,99].includes(cfg.limit)?cfg.limit:99);closeModal();render()">Сохранить</button><button class="cancel" onclick="closeModal()">Отмена</button>`)}function playerMenu(id){let p=players.find(x=>x.id===id);if(!p)return;openModal(`<h2>${esc(p.name)}</h2><p>Баффов использовано: <b>${p.buffs}</b></p><button class="save" onclick="closeModal();editPlayer('${id}')">✎ Редактировать игрока</button><button class="cancel" onclick="if(confirm('Удалить игрока и его комментарий?')){players=players.filter(x=>x.id!=='${id}');cloudDeletePlayer('${id}');save();closeModal();render()}else closeModal()">Удалить игрока</button><button class="cancel" onclick="closeModal()">Закрыть</button>`)}window.timeSortMode='time';function sortPlayers(){window.timeSortMode=window.timeSortMode==='time'?'timeDesc':'time';let b=document.getElementById('sortTimeBtn');if(b){b.textContent=window.timeSortMode==='time'?'↓':'↑';b.title=window.timeSortMode==='time'?'Сначала меньше времени':'Сначала больше времени';b.setAttribute('aria-label',b.title)}render()}function showComments(){openModal(`<h2>Комментарии игроков</h2>${players.filter(p=>p.comment).map(p=>`<p><b>${esc(p.name)}:</b> ${esc(p.comment)}</p>`).join('')||'<p class="muted">Комментариев пока нет.</p>'}<button class="cancel" onclick="closeModal()">Закрыть</button>`)}

// Общее облачное хранилище Supabase.
let cloudReady = false;
let cloudChannel = null;
let cloudLoading = false;
let cloudReloadPending = false;
let cloudStarting = false;
let cloudUserId = null;
let cloudSnapshot = new Map();
let cloudSyncRunning = false;
let cloudSyncAgain = false;

function cloudUUID() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random()*16|0;
    return (c==='x'?r:(r&3|8)).toString(16);
  });
}

function cloudFingerprint(p) {
  return JSON.stringify([
    p.id,p.name,p.category||'construction',Math.round(p.end),
    Math.round(p.initial||0),Number(p.buffs)||0,p.comment||'',p.avatar||null
  ]);
}

function cloudToRow(p) {
  return {
    id:p.id,
    name:p.name,
    category:p.category||'construction',
    end_at:Math.round(p.end),
    initial_ms:Math.round(p.initial||0),
    buffs:Math.max(0,Number(p.buffs)||0),
    comment:p.comment||'',
    avatar_url:p.avatar||null,
    updated_at:new Date().toISOString()
  };
}

function cloudFromRow(r) {
  return {
    id:r.id,
    name:r.name,
    category:r.category||'construction',
    end:Number(r.end_at),
    initial:Number(r.initial_ms)||0,
    buffs:Number(r.buffs)||0,
    comment:r.comment||'',
    avatar:r.avatar_url||null,
    linkedUserId:r.linked_user_id||null
  };
}

async function cloudLoadPlayers() {
  if (!supabaseClient || !currentAuthSession) return;
  if (cloudLoading) {
    cloudReloadPending=true;
    return;
  }
  cloudLoading=true;
  try {
    const {data,error}=await supabaseClient.from('players')
      .select('*').order('created_at',{ascending:true});
    if(error) throw error;
    if(!currentAuthSession) return;

    players=(data||[]).map(cloudFromRow);
    cloudSnapshot=new Map(players.map(p=>[p.id,cloudFingerprint(p)]));
    localStorage.setItem(KEY,JSON.stringify(players));
    cloudReady=true;
    render();
    await refreshBuffUsage();
    authStatus('Вход выполнен · Облако синхронизировано');
  } catch(e) {
    cloudReady=false;
    authStatus('Ошибка облака: '+(e.message||e));
    console.error('Supabase load:',e);
  } finally {
    cloudLoading=false;
    if(cloudReloadPending) {
      cloudReloadPending=false;
      cloudLoadPlayers();
    }
  }
}

async function cloudSyncChanges() {
  if(!cloudReady || !supabaseClient || !currentAuthSession) return;
  if(cloudSyncRunning) {
    cloudSyncAgain=true;
    return;
  }
  cloudSyncRunning=true;
  try {
    do {
      cloudSyncAgain=false;
      const changed=players.filter(p=>
        cloudSnapshot.get(p.id)!==cloudFingerprint(p)
      );
      if(changed.length) {
        const {data,error}=await supabaseClient.from('players')
          .upsert(changed.map(cloudToRow),{onConflict:'id'}).select('*');
        if(error) throw error;
        (data||[]).forEach(r=>{
          const p=cloudFromRow(r);
          cloudSnapshot.set(p.id,cloudFingerprint(p));
        });
      }
      if(players.some(p=>cloudSnapshot.get(p.id)!==cloudFingerprint(p)))
        cloudSyncAgain=true;
    } while(cloudSyncAgain && currentAuthSession);
  } catch(e) {
    authStatus('Ошибка синхронизации: '+(e.message||e));
    console.error('Supabase sync:',e);
  } finally {
    cloudSyncRunning=false;
  }
}

async function cloudDeletePlayer(id) {
  cloudSnapshot.delete(id);
  if(!supabaseClient || !currentAuthSession || !cloudReady) return;
  try {
    const {error}=await supabaseClient.from('players').delete().eq('id',id);
    if(error) throw error;
  } catch(e) {
    authStatus('Ошибка удаления: '+(e.message||e));
    console.error('Supabase delete:',e);
  }
}

async function cloudStart(session) {
  if(!session || !session.user) {
    cloudStop();
    return;
  }
  const uid=session.user.id;
  if(cloudUserId===uid && (cloudChannel || cloudStarting)) return;

  cloudStarting=true;
  cloudReady=false;
  cloudUserId=uid;
  cloudSnapshot.clear();
  try {
    if(cloudChannel) {
      await supabaseClient.removeChannel(cloudChannel);
      cloudChannel=null;
    }
    await cloudLoadPlayers();
    if(!currentAuthSession || currentAuthSession.user.id!==uid) return;

    cloudChannel=supabaseClient.channel('shared-players-'+uid)
      .on('postgres_changes',{
        event:'*',schema:'public',table:'players'
      },()=>cloudLoadPlayers())
      .subscribe(status=>{
        if(status==='CHANNEL_ERROR' || status==='TIMED_OUT')
          console.warn('Supabase Realtime:',status);
      });
  } catch(e) {
    authStatus('Ошибка подключения облака: '+(e.message||e));
    console.error('Supabase start:',e);
  } finally {
    cloudStarting=false;
  }
}

function cloudStop() {
  cloudReady=false;
  cloudUserId=null;
  cloudSnapshot.clear();
  if(cloudChannel && supabaseClient) {
    supabaseClient.removeChannel(cloudChannel);
    cloudChannel=null;
  }
  players=[];
  localStorage.setItem(KEY,'[]');
  render();
}

let chatChannel = null;
let chatStarted = false;

function chatStatus(text) {
  document.getElementById('chatStatus').textContent = text;
}

function drawChat(rows) {
  const box = document.getElementById('chatMessages');
  box.innerHTML = rows.map(m => {
    const mine = currentAuthSession &&
      m.user_id === currentAuthSession.user.id;
    const time = new Date(m.created_at).toLocaleString('ru-RU', {
      day:'2-digit', month:'2-digit',
      hour:'2-digit', minute:'2-digit'
    });
    return `<div style="align-self:${mine?'flex-end':'flex-start'};max-width:90%;background:${mine?'#174a68':'#142b40'};padding:9px 11px;border-radius:12px;overflow-wrap:anywhere">
      <div style="font-size:11px;color:#8fb3df;margin-bottom:4px">${esc(m.sender_name)} · ${time}</div>
      <div style="white-space:pre-wrap">${esc(m.message)}</div>
    </div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

function chatAuthChanged(session) {
  if (!session) {
    chatStarted = false;
    if (chatChannel && supabaseClient) {
      supabaseClient.removeChannel(chatChannel);
      chatChannel = null;
    }
    chatStatus("Войдите через Google, чтобы пользоваться чатом");
    drawChat([]);
  } else if (activeTab === "chat") {
    initChat();
  }
}

async function loadChat() {
  if (!supabaseClient || !currentAuthSession) {
    chatStatus('Войдите через Google, чтобы пользоваться чатом');
    drawChat([]);
    return;
  }
  chatStatus('Загрузка сообщений…');
  const cutoff = new Date(Date.now()-86400000).toISOString();
  const {data,error} = await supabaseClient
    .from('chat_messages')
    .select('id,user_id,sender_name,message,created_at')
    .gt('created_at',cutoff)
    .order('created_at',{ascending:true})
    .limit(500);

  if (error) {
    chatStatus('Ошибка чата: '+error.message);
    return;
  }
  drawChat(data || []);
  chatStatus('Общий чат · история за 24 часа');
}

async function initChat() {
  if (!supabaseClient || !currentAuthSession) {
    chatStatus('Войдите через Google, чтобы пользоваться чатом');
    drawChat([]);
    return;
  }
  await loadChat();
  if (!chatStarted) {
    chatStarted = true;
    chatChannel = supabaseClient.channel('public-chat-messages')
      .on('postgres_changes',
        {event:'*',schema:'public',table:'chat_messages'},
        () => { if(activeTab==='chat') loadChat(); })
      .subscribe(status => {
        if(status==='CHANNEL_ERROR' || status==='TIMED_OUT')
          chatStatus('Ошибка подключения обновлений чата');
      });
  }
}

document.getElementById('chatForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (!supabaseClient || !currentAuthSession) {
    chatStatus('Сначала войдите через Google');
    return;
  }
  const input = document.getElementById('chatInput');
  const message = input.value.trim();
  if (!message) return;

  input.disabled = true;
  const user = currentAuthSession.user;
  const sender = user.user_metadata?.full_name ||
    user.user_metadata?.name ||
    user.email?.split('@')[0] || 'Игрок';

  const {error} = await supabaseClient.from('chat_messages').insert({
    user_id:user.id,
    sender_name:String(sender).slice(0,100),
    message:message
  });
  input.disabled = false;

  if (error) {
    chatStatus('Не удалось отправить: '+error.message);
    return;
  }
  input.value = '';
  await loadChat();
});

async function loginTelegram() {
  await loginOAuth('custom:telegram', 'Telegram');
}

async function loginOAuth(provider, label) {
  if (!supabaseClient) {
    alert('Supabase не загрузился. Проверь подключение к интернету.');
    return;
  }
  authStatus('Открываем ' + label + '...');
  try {
    const {data, error} = await supabaseClient.auth.signInWithOAuth({
      provider: provider,
      options: { redirectTo: AUTH_REDIRECT, skipBrowserRedirect: true }
    });
    if (error) throw error;
    if (!data || !data.url) throw new Error('Ссылка авторизации не получена');
    if (!window.AndroidBridge) throw new Error('Не найден Android-мост');
    window.AndroidBridge.openExternalUrl(data.url);
  } catch (e) {
    authStatus('Не удалось начать вход');
    alert('Ошибка входа: ' + (e.message || e));
  }
}

async function loginGoogle() {
  await loginOAuth('google', 'Google');
}


async function logoutGoogle() {
  if (!supabaseClient) return;
  const {error} = await supabaseClient.auth.signOut();
  if (error) alert('Не удалось выйти: ' + error.message);
  else updateAuthUI(null);
}

window.handleAuthCallback = async function(callbackUrl) {
  try {
    const uri = new URL(callbackUrl);
    const errorText = uri.searchParams.get('error_description') ||
                      uri.searchParams.get('error');
    if (errorText) {
      authStatus('Ошибка входа через Google');
      alert('Google: ' + errorText);
      return;
    }
    const code = uri.searchParams.get('code');
    if (!code) {
      authStatus('В ответе Google нет кода авторизации');
      return;
    }
    authStatus('Завершаем вход...');
    const {data, error} = await supabaseClient.auth.exchangeCodeForSession(code);
    if (error) throw error;
    updateAuthUI(data.session);
    authStatus('Вход выполнен');
  } catch (e) {
    authStatus('Ошибка завершения входа');
    alert('Не удалось завершить вход: ' + (e.message || e));
  }
};
